<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <rect width="400" height="300" fill="#F8FAFC" rx="12" />
  <rect x="2" y="2" width="396" height="296" stroke="#E2E8F0" stroke-width="2" rx="10" stroke-dasharray="6 4" />
  
  <!-- Subtle Grid Pattern in background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" rx="12" opacity="0.6"/>

  <!-- Hardware Device Graphic (Server / Switch outline) -->
  <g transform="translate(140, 85)" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1U / 2U Hardware Chassis -->
    <rect x="0" y="0" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#64748B" />
    <circle cx="16" cy="18" r="3" fill="#3B82F6" stroke="none" />
    <circle cx="28" cy="18" r="3" fill="#10B981" stroke="none" />
    <line x1="44" y1="14" x2="60" y2="14" stroke="#CBD5E1" stroke-width="2" />
    <line x1="44" y1="22" x2="70" y2="22" stroke="#CBD5E1" stroke-width="2" />
    <rect x="85" y="10" width="12" height="16" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="100" y="10" width="12" height="16" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />

    <!-- Lower Chassis Layer -->
    <rect x="0" y="44" width="120" height="36" rx="4" fill="#FFFFFF" stroke="#94A3B8" />
    <circle cx="16" cy="62" r="3" fill="#64748B" stroke="none" />
    <line x1="32" y1="58" x2="68" y2="58" stroke="#CBD5E1" stroke-width="2" />
    <line x1="32" y1="66" x2="52" y2="66" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="95" cy="62" r="5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- Status / Verification Text -->
  <text x="200" y="195" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155" letter-spacing="0.5">
    HARDWARE SPECIFICATION PENDING PHOTO
  </text>
  <text x="200" y="215" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">
    DEYSLA Enterprise Solutions · Authentic OEM Catalogue
  </text>

  <!-- Verified Security Badge Pill -->
  <g transform="translate(130, 235)">
    <rect width="140" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <circle cx="16" cy="12" r="4" fill="#2563EB" />
    <text x="76" y="16" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1D4ED8" letter-spacing="0.3">
      OFFICIAL DATASHEET
    </text>
  </g>
</svg>
